[project]
name = "asaxiy"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiogram>=3.31,<4",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "sqlmodel>=0.0.50",
    "uv>=0.13.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
